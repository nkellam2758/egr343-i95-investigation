<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The I-95 Collapse Investigation — EGR 343</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--maroon:#8C1D40;--gold:#FFC627;--ink:#191919;--muted:#5c5c5c;--line:#d9d9d9;--bg:#fafafa;--ok:#2e7d32;--bad:#b00020}
  *{box-sizing:border-box}
  body{margin:0;font-family:Roboto,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
  header{background:var(--maroon);color:#fff;padding:14px 20px;border-bottom:5px solid var(--gold)}
  header h1{margin:0;font-size:1.3rem}
  header p{margin:2px 0 0;font-size:.9rem;opacity:.9}
  nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
  nav button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font:inherit;font-size:.85rem;cursor:pointer}
  nav button.on{background:var(--maroon);color:#fff;border-color:var(--maroon)}
  nav button.done::after{content:" ✓";color:var(--ok)}
  nav button.on.done::after{color:var(--gold)}
  nav button:disabled{opacity:.4;cursor:not-allowed}
  main{max-width:940px;margin:0 auto;padding:20px}
  h2{color:var(--maroon);margin-top:0}
  h3{color:var(--maroon)}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
  .btn{background:var(--maroon);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:500;cursor:pointer}
  .btn.alt{background:#fff;color:var(--maroon);border:1px solid var(--maroon)}
  .btn.sm{padding:4px 10px;font-size:.85rem}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  input[type=text],input[type=number],select,textarea{font:inherit;padding:7px 9px;border:1px solid #bbb;border-radius:6px;width:100%;background:#fff}
  textarea{min-height:80px}
  label{font-weight:500;display:block;margin:8px 0 4px}
  .note{font-size:.85rem;color:var(--muted)}
  .msg{font-weight:500;margin-top:6px}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  .video{position:relative;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden;margin:10px 0}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .hyp{display:grid;grid-template-columns:1fr 190px auto;gap:8px;align-items:center;margin:6px 0}
  .hyp.st{grid-template-columns:1fr 170px 170px auto}
  @media(max-width:700px){.hyp,.hyp.st{grid-template-columns:1fr}}
  .tag{font-size:.75rem;padding:2px 8px;border-radius:10px;background:#f4eef0;color:var(--maroon);white-space:nowrap}
  .tag.int{background:#fffbea;color:#7a5b00}
  .ro{padding:7px 9px;border:1px dashed #ccc;border-radius:6px;background:#f7f7f7}
  .people{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
  .person{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;cursor:pointer;font:inherit}
  .person.on{border:2px solid var(--maroon)}
  .person b{display:block;color:var(--maroon)}
  .q{display:block;width:100%;text-align:left;margin:6px 0;background:#f4eef0;border:1px solid #e3d3d9;border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
  .q.asked{background:#fff;color:var(--muted)}
  .say{border-left:4px solid var(--gold);background:#fffbea;padding:8px 12px;margin:8px 0;border-radius:0 8px 8px 0}
  .ev{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;margin:4px;font-size:.88rem;max-width:100%}
  .ev .id{font-weight:700;color:var(--maroon);margin-right:4px}
  .ev.calc{border-color:var(--gold);background:#fffbea}
  .chip{cursor:pointer;user-select:none}
  .chip.sel{background:var(--maroon);color:#fff;border-color:var(--maroon)}
  .chip.sel .id{color:var(--gold)}
  table{border-collapse:collapse;margin:8px 0}
  td,th{border:1px solid var(--line);padding:4px 10px;text-align:center}
  th{background:#f4eef0}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.row{grid-template-columns:1fr}}
  .ans{display:grid;grid-template-columns:1fr 160px 70px;gap:8px;align-items:center;margin:6px 0}
  .ans .st{font-size:1.05rem}
  .rc{border:2px solid #e3d3d9;border-radius:10px;padding:12px;margin-bottom:12px;background:#fff}
  .rc h3{margin:0 0 6px;font-size:1rem}
  .fish{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
  .fish div{border:1px solid var(--line);border-top:4px solid var(--maroon);border-radius:6px;padding:8px;background:#fff;font-size:.88rem}
  .fish b{display:block;color:var(--maroon);margin-bottom:4px}
  .fish .x{text-decoration:line-through;color:#999}
  .why{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:center;margin:6px 0}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:1.4rem;letter-spacing:2px;background:var(--maroon);color:var(--gold);padding:6px 14px;border-radius:8px;display:inline-block}
  #report pre{white-space:pre-wrap;font-family:inherit}
  .hidden{display:none}
  @media print{header,nav,.noprint{display:none!important}body{background:#fff}.card{border:0}}
</style>
</head>
<body>
<header>
  <h1>The I-95 Collapse Investigation</h1>
  <p>EGR 343 Mechanics of Materials · A root cause analysis of the June 11, 2023 overpass collapse in Philadelphia</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
/* ================= DATA ================= */
const STAGES=[["video","1. Watch & guess"],["interviews","2. Interviews"],["update","3. Update your list"],["lab","4. Lab bench"],["rca","5. Root cause analysis"],["reflect","6. Reflection"],["report","7. Report"]];
const VIDEO_ID="iKNw1mnA5M0";
const CATS=["People","Vehicle & equipment","Rules & organizations","Structure & materials","Environment & site"];
const STATUS=["Supported","Revised","Ruled out","Not enough evidence"];
const TYPES=["Direct cause","Contributing factor","Systemic root cause"];
const VIRTUES=["Attentiveness","Prudence (practical wisdom)","Responsibility","Integrity","Diligence","Humility","Courage","Foresight","Care for others","Honesty"];

const CARDS={
 E1:"The truck entered the curved exit ramp at about 44–54 mph. The ramp's advisory speed was 25 mph, with a truck rollover warning sign.",
 E2:"Tire marks on the ramp showed the rollover was caused by the high speed at which the truck entered the curve.",
 E3:"The NTSB's probable cause: the driver failed to slow down, likely from inattention possibly linked to fatigue. Phone records ruled out phone use.",
 E4:"The 2017 truck had no electronic stability control (ESC). It predated the 2019 federal requirement, and simulations showed ESC would have prevented this rollover.",
 E5:"The driver worked overnight shifts (10 p.m.–8 a.m.) and switched to a daytime schedule on days off; he had about 5.5 hours of sleep opportunity the day before.",
 E6:"The tank's front manhole cover was open at all three stops that shift. Federal rules require it to be closed and secured in transport.",
 E7:"Company policy required drivers to check manhole covers before each trip, and the driver had signed it. After the crash, the company moved to an electronic checklist.",
 E8:"When the trailer rolled, gasoline escaped through the open manhole and spread fire across the ramp and the underpass.",
 E9:"Burning gasoline entered the storm drains. Explosions over several hours blew drain covers off along the path to the Delaware River, about 800 ft away.",
 E10:"The truck came to rest and burned directly underneath the northbound I-95 overpass.",
 E11:"The overpass was a concrete deck on steel girders. A fire on top is shielded by the concrete; a fire underneath heats the steel directly.",
 E12:"Drivers' videos showed the road deck sagging badly during the fire, minutes before it collapsed.",
 E13:"Like most highway bridges, this one wasn't designed to withstand an extreme fire underneath it.",
 E14:"The southbound span next door was also damaged by the heat and judged unsafe after inspection."
};

const PEOPLE=[
 {id:"ntsb",name:"Morgan Hale",role:"Highway crash investigator",qs:[
   ["How fast was the truck going?","Our best estimate is somewhere between 44 and 54 mph as it entered the ramp. The advisory speed was 25, and there was a truck rollover warning sign before the curve.","E1"],
   ["How do you know speed caused the rollover?","The tire marks. A truck that's going too fast for a curve leaves a signature on the pavement, and this one did. The rollover came from the speed it carried into that curve.","E2"],
   ["Why didn't the driver slow down?","Our probable cause is that he didn't slow down because he wasn't paying attention to the road, and that inattention may have been related to fatigue. We checked his phone records: no calls or texts at the time, so it wasn't the phone.","E3"],
   ["Could the truck itself have prevented this?","Possibly. Newer truck tractors have electronic stability control, which brakes automatically when the truck starts to tip. This truck was built in 2017, before that was required in 2019. Our simulations say ESC would have prevented this rollover at any speed in that range.","E4"]]},
 {id:"safety",name:"Chris Delgado",role:"Trucking company safety manager",qs:[
   ["What was the driver's schedule like?","He drove overnight, 10 p.m. to 8 a.m., and switched back to a daytime schedule on his days off. That's hard on anyone's body. The day before the crash he had only about five and a half hours to sleep.","E5"],
   ["Was anything wrong with the tank?","Yes. The manhole cover on the front compartment of the tank was open. Video shows it open at every stop he made that shift. Federal rules say it has to be closed and secured whenever you're on the road.","E6"],
   ["Didn't anyone check?","Our policy said drivers check manhole covers in the pre-trip inspection, and he'd signed off on it. After the crash, we moved to an electronic checklist that won't let you finish until you confirm every cover is secured.","E7"]]},
 {id:"fire",name:"Captain Rosa Ibáñez",role:"Fire department captain",qs:[
   ["Why was the fire so intense?","Gasoline came pouring out of that open manhole when the trailer went over, and it spread across the whole ramp and underpass. A closed tank would have been a very different fire.","E8"],
   ["What was strange about this fire?","The storm drains. Burning gasoline ran into them, and for hours we had explosions underground, popping drain covers off all the way toward the river, about 800 feet away.","E9"],
   ["Where exactly was the fire?","Right under the northbound overpass. The truck came to rest and burned directly beneath the bridge.","E10"]]},
 {id:"eng",name:"Dr. Priya Nair",role:"Structural engineer",qs:[
   ["Why did a truck fire bring down a highway?","It's about where the fire was. This overpass was a concrete deck on steel girders. If a truck burns on top, the concrete shields the steel. This one burned underneath, so the girders took the heat directly.","E11"],
   ["Did the steel melt?","It didn't need to. Steel loses a lot of strength and stiffness long before it melts. Look at the drivers' videos: the deck is sagging badly minutes before it falls. You'll put numbers on that at the lab bench.","E12"],
   ["Shouldn't bridges be designed for fire?","Most highway bridges aren't designed for an extreme fire underneath them. Fire protection costs money, and this kind of fire is rare. Whether that tradeoff still makes sense is a fair question for engineers.","E13"],
   ["What happened to the southbound side?","It didn't fall, but the heat damaged it too. After inspection it was judged unsafe and had to come down.","E14"]]}
];

/* Eurocode-style reduction factors for carbon steel at elevated temperature */
const KY={20:1.00,400:1.00,500:0.78,600:0.47,700:0.23,800:0.11};
const KE={20:1.00,400:0.70,500:0.60,600:0.31,700:0.13,800:0.09};
function interp(tab,T){const ks=Object.keys(tab).map(Number).sort((a,b)=>a-b);for(let i=0;i<ks.length-1;i++){if(T>=ks[i]&&T<=ks[i+1]){const f=(T-ks[i])/(ks[i+1]-ks[i]);return tab[ks[i]]+f*(tab[ks[i+1]]-tab[ks[i]]);}}return tab[800];}

/* ================= SEEDED PARAMETERS ================= */
const G=32.2, TRACK=6.0, VREF=49;
function norm(n){return (n||"").trim().toLowerCase().replace(/\s+/g," ");}
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function params(name){
  const r=rng(fnv("i95c|"+norm(name)));
  const R=120+10*Math.floor(r()*9);                         // ft
  const h=Math.round((6.5+0.1*Math.floor(r()*11))*10)/10;    // ft
  const L=60+2*Math.floor(r()*11);                           // ft
  const w=Math.round((2.0+0.1*Math.floor(r()*11))*10)/10;    // kip/ft
  const M=w*L*L/8;
  const S=Math.round(M*12/(24+r()*6)/10)*10;                 // in^3
  const T=[600,650,700][Math.floor(r()*3)];
  const srt=TRACK/(2*h), vfps=Math.sqrt(G*R*srt), vmph=vfps*3600/5280;
  const v49=VREF*5280/3600, a49=v49*v49/(G*R);
  const sig=M*12/S, FS20=50/sig, FST=50*interp(KY,T)/sig, sag=1/interp(KE,T);
  return {R,h,L,w,S,T,srt,vmph,a49,M,sig,FS20,FST,sag};
}
function code(name){
  const p=params(name);const h=fnv("I95c1|"+norm(name)+"|"+p.R+p.h+p.L+p.w+p.S+p.T);
  const h2=fnv(String(h)+"|kellam");
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="",x=h,y=h2;
  for(let i=0;i<4;i++){s+=A[x%32];x=Math.floor(x/32);}s+="-";
  for(let i=0;i<4;i++){s+=A[y%32];y=Math.floor(y/32);}return s;
}

/* ================= STATE ================= */
const KEY="egr343-i95-collapse-v1";
const blankTop=()=>({h:"",cards:[],type:"",virtue:"",fix:""});
let S={stage:"video",name:"",hyp:[],nextId:1,locked:false,asked:{},person:"ntsb",cards:[],lab:{},tries:{},labDone:{a:false,b:false},
  why:["","","","",""],top:[blankTop(),blankTop(),blankTop()],r1:"",r2:""};
try{const s=localStorage.getItem(KEY);if(s)S=Object.assign(S,JSON.parse(s));}catch(e){}
if(!S.hyp.length){addHyp("video");addHyp("video");addHyp("video");addHyp("video");}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function addHyp(src){S.hyp.push({id:"h"+(S.nextId++),t:"",c:"",s:"",src});}
function P(){return params(S.name);}
function has(c){return S.cards.includes(c);}
function give(c){if(!has(c))S.cards.push(c);}
function words(t){return (t||"").trim().split(/\s+/).filter(Boolean).length;}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(x,d=3){return Number(Number(x).toPrecision(d)).toLocaleString("en-US",{maximumFractionDigits:3});}
const vidHyps=()=>S.hyp.filter(h=>h.src==="video");
const intHyps=()=>S.hyp.filter(h=>h.src==="interview");
const okHyp=h=>words(h.t)>=3&&!!h.c;
const hypById=id=>S.hyp.find(h=>h.id===id);

/* ================= COMPLETION ================= */
const totalQs=PEOPLE.reduce((a,p)=>a+p.qs.length,0);
function done(st){
  switch(st){
    case"video":return !!S.name.trim()&&vidHyps().filter(okHyp).length>=4&&vidHyps().every(h=>okHyp(h)||!h.t.trim());
    case"interviews":return Object.keys(S.asked).length>=totalQs;
    case"update":return vidHyps().filter(okHyp).every(h=>!!h.s)&&intHyps().filter(okHyp).length>=2&&intHyps().every(h=>okHyp(h)||!h.t.trim());
    case"lab":return S.labDone.a&&S.labDone.b;
    case"rca":return rcaErrors().length===0;
    case"reflect":return words(S.r1)>=40&&words(S.r2)>=40;
    case"report":return false;
  }
}
function unlocked(st){const i=STAGES.findIndex(s=>s[0]===st);for(let j=0;j<i;j++){if(!done(STAGES[j][0]))return false;}return true;}
function calcCards(){
  const p=P(),c={};
  if(S.labDone.a)c.C1=`Your lab: on a ${p.R} ft radius curve, this loaded tanker tips at about ${fmt(p.vmph)} mph. At ${VREF} mph it would need ${fmt(p.a49)} g of sideways grip, but it tips at ${fmt(p.srt)} g.`;
  if(S.labDone.b)c.C2=`Your lab: at ${p.T}°C the girder's factor of safety drops from ${fmt(p.FS20)} to ${fmt(p.FST)}, and it sags about ${fmt(p.sag)} times as much.`;
  return c;
}
function allCards(){return Object.assign({},Object.fromEntries(S.cards.map(k=>[k,CARDS[k]])),calcCards());}
const liveHyps=()=>S.hyp.filter(h=>okHyp(h)&&h.s!=="Ruled out");
function rcaErrors(){
  const e=[];
  S.why.forEach((w,i)=>{if(words(w)<4)e.push(`5 Whys: answer why #${i+1} (at least 4 words).`);});
  S.top.forEach((r,i)=>{const n=i+1;
    if(!r.h||!hypById(r.h))e.push(`Root cause ${n}: choose one from your list.`);
    if(r.cards.length<2)e.push(`Root cause ${n}: link at least 2 evidence cards.`);
    if(!r.type)e.push(`Root cause ${n}: classify it.`);
    if(!r.virtue)e.push(`Root cause ${n}: choose a virtue.`);
    if(words(r.fix)<12)e.push(`Root cause ${n}: propose a prevention in at least 12 words (${words(r.fix)} so far).`);});
  const hs=S.top.map(r=>r.h).filter(Boolean);
  if(new Set(hs).size<hs.length)e.push("Your three root causes must be different.");
  if(!S.top.some(r=>r.cards.some(c=>c[0]==="C")))e.push("At least one root cause must be backed by your own lab result (C1 or C2).");
  if(!S.top.some(r=>{const h=hypById(r.h);return h&&h.c==="Structure & materials";}))e.push("At least one root cause must be in the Structure & materials category. This is a materials class, after all.");
  return e;
}

/* ================= RENDER ================= */
function go(st){
  if(S.stage==="video"&&st!=="video"&&done("video")){S.locked=true;S.hyp=S.hyp.filter(h=>h.src!=="video"||okHyp(h));}
  if(st==="update"&&!intHyps().length){addHyp("interview");addHyp("interview");}
  S.stage=st;save();render();window.scrollTo(0,0);
}
function render(){
  renderNav();
  document.getElementById("main").innerHTML=({video:vVideo,interviews:vInt,update:vUpdate,lab:vLab,rca:vRCA,reflect:vReflect,report:vReport}[S.stage])();
  wire();
}
function renderNav(){
  document.getElementById("nav").innerHTML=STAGES.map(([k,l])=>`<button class="${S.stage===k?"on":""} ${done(k)?"done":""}" ${unlocked(k)?"":"disabled"} onclick="go('${k}')">${l}</button>`).join("");
}
function refresh(){renderNav();const b=document.getElementById("nextBtn");if(b)b.disabled=!done(S.stage);const e=document.getElementById("err");if(e&&S.stage==="rca")e.innerHTML=errHTML();}
function next(){const i=STAGES.findIndex(s=>s[0]===S.stage);const n=STAGES[i+1];return n?`<p><button id="nextBtn" class="btn" ${done(S.stage)?"":"disabled"} onclick="go('${n[0]}')">Continue to ${n[1].replace(/^\d+\.\s/,"")} →</button></p>`:"";}
function evHTML(id,txt,extra=""){return `<span class="ev ${id[0]==="C"?"calc":""} ${extra}" data-id="${id}"><span class="id">${id}</span>${esc(txt)}</span>`;}
const catSel=(h,dis)=>`<select data-h="${h.id}" data-f="c" ${dis?"disabled":""}><option value="">Category…</option>${CATS.map(c=>`<option ${h.c===c?"selected":""}>${c}</option>`).join("")}</select>`;

function vVideo(){
  return `<div class="card"><h2>Watch and make your first guesses</h2>
  <p>Early on Sunday morning, June 11, 2023, a gasoline tanker truck crashed on an exit ramp in Northeast Philadelphia and caught fire. Within the hour, part of Interstate 95, which carries about 160,000 vehicles a day, had collapsed.</p>
  <p>You're joining the investigation. Start the way real investigators do: look at the evidence you have and write down your first hypotheses about <b>why</b> this happened.</p>
  <div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${VIDEO_ID}" title="Philadelphia I-95 Bridge Collapse Explained (Practical Engineering)" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
  <p class="note">If the video doesn't load, watch it on YouTube: <a href="https://www.youtube.com/watch?v=${VIDEO_ID}" target="_blank" rel="noopener">Philadelphia I-95 Bridge Collapse Explained</a> (Practical Engineering, about 17 min). It was made five weeks after the collapse, before the official investigation finished, so it can't tell you everything.</p>
  <label for="nm">Your full name, exactly as it appears in Canvas</label>
  <input id="nm" type="text" value="${esc(S.name)}" ${S.locked?"disabled":""}>
  <p class="note">Your name sets your lab numbers, so every student's numbers are different. Progress saves in this browser.</p></div>
  <div class="card"><h3 style="margin-top:0">Your first list of root causes</h3>
  <p>Write at least <b>4</b> possible causes, and tag each one with a category. Think beyond "the truck crashed": people, equipment, rules, the structure, the site. ${S.locked?"<b>This list is now locked</b> so you can compare it with what you learn.":"Once you move on, this list locks."}</p>
  ${vidHyps().map(h=>`<div class="hyp">${S.locked?`<div class="ro">${esc(h.t)}</div><div class="ro">${esc(h.c)}</div><span></span>`:`<input type="text" data-h="${h.id}" data-f="t" value="${esc(h.t)}" placeholder="e.g., The truck was going too fast for the ramp">${catSel(h)}<button class="btn alt sm" data-del="${h.id}">✕</button>`}</div>`).join("")}
  ${S.locked?"":`<p><button class="btn alt sm" onclick="addHyp('video');save();render()">+ Add another</button></p><p class="note">Each cause needs at least 3 words and a category.</p>`}
  </div>${next()}`;
}

function vInt(){
  const p=PEOPLE.find(x=>x.id===S.person);
  return `<div class="card"><h2>Interviews</h2><p>Talk to four people who know what the video couldn't. Ask every question; each answer adds an evidence card. (${Object.keys(S.asked).length} of ${totalQs} asked)</p>
  <div class="people">${PEOPLE.map(x=>{const n=x.qs.filter((q,i)=>S.asked[x.id+i]).length;return `<button class="person ${x.id===S.person?"on":""}" onclick="S.person='${x.id}';save();render()"><b>${x.name}</b>${x.role}<br><span class="note">${n}/${x.qs.length} questions</span></button>`}).join("")}</div>
  <p class="note">The characters are fictional. Their facts come from the NTSB's final report (HIR-25-01, 2025) and from news coverage of the investigation.</p></div>
  <div class="card"><h3 style="margin-top:0">${p.name}, ${p.role}</h3>
  ${p.qs.map((q,i)=>{const k=p.id+i;return `<button class="q ${S.asked[k]?"asked":""}" onclick="ask('${p.id}',${i})">${S.asked[k]?"✓ ":"❓ "}${esc(q[0])}</button>${S.asked[k]?`<div class="say">${esc(q[1])}</div>${evHTML(q[2],CARDS[q[2]])}`:""}`}).join("")}
  </div>
  <div class="card"><h3 style="margin-top:0">Evidence notebook</h3>${S.cards.length?S.cards.map(c=>evHTML(c,CARDS[c])).join(""):'<span class="note">Empty so far.</span>'}</div>${next()}`;
}
function ask(pid,i){S.asked[pid+i]=1;give(PEOPLE.find(x=>x.id===pid).qs[i][2]);save();render();}

function vUpdate(){
  return `<div class="card"><h2>Update your list</h2>
  <p>Now compare your first guesses with the evidence. For each one, decide: was it <b>supported</b>, does it need to be <b>revised</b>, was it <b>ruled out</b>, or is there <b>not enough evidence</b>? Then add the causes the video didn't show you.</p></div>
  <div class="card"><h3 style="margin-top:0">From the video</h3>
  ${vidHyps().map(h=>`<div class="hyp st"><div class="ro">${esc(h.t)}</div><div class="ro">${esc(h.c)}</div><select data-h="${h.id}" data-f="s"><option value="">Verdict…</option>${STATUS.map(s=>`<option ${h.s===s?"selected":""}>${s}</option>`).join("")}</select><span></span></div>`).join("")}</div>
  <div class="card"><h3 style="margin-top:0">New from the interviews</h3><p class="note">Add at least 2 causes you didn't think of before.</p>
  ${intHyps().map(h=>`<div class="hyp"><input type="text" data-h="${h.id}" data-f="t" value="${esc(h.t)}" placeholder="A cause the interviews revealed">${catSel(h)}<button class="btn alt sm" data-del="${h.id}">✕</button></div>`).join("")}
  <p><button class="btn alt sm" onclick="addHyp('interview');save();render()">+ Add another</button></p></div>
  <div class="card"><h3 style="margin-top:0">Evidence notebook</h3>${S.cards.map(c=>evHTML(c,CARDS[c])).join("")}</div>${next()}`;
}

function labRow(key,label,unit){
  const v=S.lab[key]??"";const st=S.lab[key+"_ok"];
  return `<div class="ans"><label for="${key}" style="margin:0">${label}</label><input id="${key}" type="number" step="any" value="${esc(v)}" data-lab="${key}"><span class="st">${st===true?'<span class="ok">✓</span>':st===false?'<span class="bad">✗</span>':""} ${unit}</span></div>`;
}
function vLab(){
  const p=P();
  return `<div class="card"><h2>Lab bench</h2><p>Two links in the chain can be checked with mechanics: the truck tipping over, and the steel giving up. Your numbers are unique to you. You get unlimited attempts, and the report records how many you used. Answers within 2% count as correct.</p>
  <p class="note">These are simplified classroom models with classroom values, not the real truck or the real bridge.</p></div>
  <div class="card"><h3 style="margin-top:0">Part A: How fast is too fast?</h3>
  <p>A truck on a curve of radius <b>R = ${p.R} ft</b> at speed v needs a sideways (centripetal) acceleration of a = v²/R. Model the loaded tanker as a rigid block with track width <b>t = ${TRACK} ft</b> and center of gravity at height <b>h = ${p.h} ft</b>. It starts to tip about its outer tires when the moment from the sideways inertia force (m·a·h) exceeds the moment from its weight (m·g·t/2). Use g = 32.2 ft/s².</p>
  ${labRow("aT","1. Rollover threshold, a/g = t/(2h)","g")}
  ${labRow("aV","2. Speed at which this truck tips on this curve","mph")}
  ${labRow("aA",`3. Sideways acceleration needed at ${VREF} mph (middle of the NTSB's estimate)`,"g")}
  <p><button class="btn" onclick="checkLab('a')">Check Part A</button> <span class="note">Attempts: ${S.tries.a||0}</span></p>
  ${S.labDone.a?`<div class="msg ok">Unlocked:</div>${evHTML("C1",calcCards().C1)}<p class="note">Think about it: a real tanker is worse than a rigid block. The liquid sloshes and the suspension leans, so it tips even sooner. Where does the 25 mph advisory sit compared with your answer?</p>`:""}
  ${S.lab.amsg?`<div class="msg bad">${esc(S.lab.amsg)}</div>`:""}</div>
  <div class="card"><h3 style="margin-top:0">Part B: Why did the deck sag and fall?</h3>
  <p>Model one northbound girder as a <b>simply supported steel beam</b> with span <b>L = ${p.L} ft</b>, carrying a uniform load of <b>w = ${p.w} kip/ft</b>. Its elastic section modulus is <b>S = ${p.S} in³</b>, and the steel's yield strength at room temperature is <b>F<sub>y</sub> = 50 ksi</b>. Assume the fire heated the girder to <b>${p.T}°C</b>.</p>
  <p>Hot steel keeps only a fraction of its strength (k<sub>y</sub>·F<sub>y</sub>) and stiffness (k<sub>E</sub>·E). Interpolate linearly:</p>
  <table><tr><th>T (°C)</th>${Object.keys(KY).map(t=>`<td>${t}</td>`).join("")}</tr><tr><th>k<sub>y</sub> (strength)</th>${Object.values(KY).map(k=>`<td>${k.toFixed(2)}</td>`).join("")}</tr><tr><th>k<sub>E</sub> (stiffness)</th>${Object.values(KE).map(k=>`<td>${k.toFixed(2)}</td>`).join("")}</tr></table>
  ${labRow("bM","1. Maximum bending moment, M<sub>max</sub>","kip·ft")}
  ${labRow("bS","2. Maximum bending stress, σ<sub>max</sub>","ksi")}
  ${labRow("bF1","3. Factor of safety against yield at room temperature","")}
  ${labRow("bF2",`4. Factor of safety against yield at ${p.T}°C`,"")}
  ${labRow("bD",`5. Midspan deflection is δ = 5wL⁴/(384EI). How many times larger is δ at ${p.T}°C?`,"×")}
  <p><button class="btn" onclick="checkLab('b')">Check Part B</button> <span class="note">Attempts: ${S.tries.b||0}</span></p>
  ${S.labDone.b?`<div class="msg ok">Unlocked:</div>${evHTML("C2",calcCards().C2)}<p class="note">Think about it: compare this with the sagging deck in the drivers' videos. What does an FS below 1 under ordinary loads mean?</p>`:""}
  ${S.lab.bmsg?`<div class="msg bad">${esc(S.lab.bmsg)}</div>`:""}</div>${next()}`;
}
function near(v,t){v=parseFloat(v);if(!isFinite(v))return false;return Math.abs(v-t)<=0.02*Math.abs(t);}
function checkLab(part){
  const p=P();S.tries[part]=(S.tries[part]||0)+1;
  const keys=part==="a"?[["aT",p.srt],["aV",p.vmph],["aA",p.a49]]:[["bM",p.M],["bS",p.sig],["bF1",p.FS20],["bF2",p.FST],["bD",p.sag]];
  let all=true;keys.forEach(([k,t])=>{const ok=near(S.lab[k],t);S.lab[k+"_ok"]=ok;if(!ok)all=false;});
  if(all){S.labDone[part]=true;S.lab[part+"msg"]="";}
  else S.lab[part+"msg"]=part==="a"?"Not yet. Set m·a·h = m·g·(t/2) at the tipping point. Convert mph to ft/s (1 mph = 5280/3600 ft/s), and convert back at the end.":"Not yet. M is in kip·ft, but σ = M/S needs kip·in. Is your temperature between two table entries? For deflection, only E changes.";
  save();render();
}

function vRCA(){
  const cards=allCards();const live=liveHyps();
  return `<div class="card"><h2>Root cause analysis</h2>
  <p>Investigators rarely find one cause. They find a chain of causes, some close to the event and some built into the system. Build your analysis in three steps.</p></div>
  <div class="card"><h3 style="margin-top:0">Step 1: Your fishbone</h3><p class="note">Every cause on your list, sorted by category. Causes you ruled out are crossed out.</p>
  <div class="fish">${CATS.map(c=>`<div><b>${c}</b>${S.hyp.filter(h=>okHyp(h)&&h.c===c).map(h=>`<div class="${h.s==="Ruled out"?"x":""}" style="border:0;padding:2px 0">• ${esc(h.t)}</div>`).join("")||'<span class="note">(none yet)</span>'}</div>`).join("")}</div></div>
  <div class="card"><h3 style="margin-top:0">Step 2: 5 Whys</h3><p>Start at the collapse and keep asking "why?" until you reach something a person, company, or rule could have changed.</p>
  <p><b>Problem:</b> The northbound I-95 overpass collapsed.</p>
  ${S.why.map((w,i)=>`<div class="why"><b>Why ${i+1}?</b><input type="text" data-why="${i}" value="${esc(w)}" placeholder="${i===0?"Because…":"And that happened because…"}"></div>`).join("")}</div>
  <div class="card"><h3 style="margin-top:0">Step 3: Your three most important root causes</h3><p>For each one, link the evidence, classify it, name the virtue that could have interrupted it, and propose a prevention.</p></div>
  ${S.top.map((r,i)=>`<div class="rc"><h3>Root cause ${i+1}</h3>
    <div class="row"><div><label>From your list</label><select data-t="${i}" data-f="h"><option value="">Choose…</option>${live.map(h=>`<option value="${h.id}" ${r.h===h.id?"selected":""}>${esc(h.t)} (${esc(h.c)})</option>`).join("")}</select></div>
    <div><label>Type</label><select data-t="${i}" data-f="type"><option value="">Choose…</option>${TYPES.map(o=>`<option ${r.type===o?"selected":""}>${o}</option>`).join("")}</select></div></div>
    <label>Evidence (click to link)</label><div>${Object.entries(cards).map(([k,t])=>evHTML(k,t,"chip "+(r.cards.includes(k)?"sel":""))).join("")}</div>
    <div class="row"><div><label>Virtue that could have interrupted this cause</label><select data-t="${i}" data-f="virtue"><option value="">Choose…</option>${VIRTUES.map(o=>`<option ${r.virtue===o?"selected":""}>${o}</option>`).join("")}</select></div><div></div></div>
    <label>Prevention: what specific change would break this link? Who would make it?</label><textarea data-t="${i}" data-f="fix">${esc(r.fix)}</textarea></div>`).join("")}
  <div class="card" id="err">${errHTML()}</div>${next()}`;
}
function errHTML(){const e=rcaErrors();return e.length?`<b>Still needed:</b><ul>${e.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<span class="msg ok">Analysis complete.</span>`;}

function vReflect(){
  return `<div class="card"><h2>Reflection</h2>
  <label for="r1">1. Compare your first list with your final analysis. What did the video lead you to miss or over-weight, and why do you think that happened? (40+ words)</label>
  <textarea id="r1" data-r="r1" style="min-height:120px">${esc(S.r1)}</textarea><div class="note" id="r1c">${words(S.r1)} words</div>
  <label for="r2">2. Which root cause is closest to the kind of work you'll do as an engineer? What habit or virtue will you practice so you don't become one of the links in a chain like this? (40+ words)</label>
  <textarea id="r2" data-r="r2" style="min-height:120px">${esc(S.r2)}</textarea><div class="note" id="r2c">${words(S.r2)} words</div></div>
  <p><button id="nextBtn" class="btn" ${done("reflect")?"":"disabled"} onclick="go('report')">See my report →</button></p>`;
}

function reportText(){
  const p=P(),cards=allCards();
  let t=`THE I-95 COLLAPSE INVESTIGATION: EGR 343\nName: ${S.name}\nCompletion code: ${code(S.name)}\n\n`;
  t+=`FIRST LIST (from the video), with verdicts after the interviews\n`;
  vidHyps().forEach(h=>{t+=`- [${h.c}] ${h.t}  ->  ${h.s}\n`;});
  t+=`\nNEW CAUSES FROM THE INTERVIEWS\n`;
  intHyps().filter(okHyp).forEach(h=>{t+=`- [${h.c}] ${h.t}\n`;});
  t+=`\nLAB BENCH (your parameters)\nPart A: R=${p.R} ft, t=${TRACK} ft, h=${p.h} ft\n  a/g threshold=${S.lab.aT}, rollover speed=${S.lab.aV} mph, a/g at ${VREF} mph=${S.lab.aA}  [attempts: ${S.tries.a||0}]\n`;
  t+=`Part B: L=${p.L} ft, w=${p.w} kip/ft, S=${p.S} in^3, T=${p.T} C\n  Mmax=${S.lab.bM} kip-ft, sigma=${S.lab.bS} ksi, FS(20C)=${S.lab.bF1}, FS(${p.T}C)=${S.lab.bF2}, deflection x${S.lab.bD}  [attempts: ${S.tries.b||0}]\n\n`;
  t+=`5 WHYS\nProblem: The northbound I-95 overpass collapsed.\n`;S.why.forEach((w,i)=>{t+=`Why ${i+1}: ${w.trim()}\n`;});
  t+=`\nTOP THREE ROOT CAUSES\n`;
  S.top.forEach((r,i)=>{const h=hypById(r.h)||{t:"",c:""};t+=`${i+1}. ${h.t} [${h.c}]\n   Type: ${r.type}\n   Virtue: ${r.virtue}\n   Evidence: ${r.cards.map(c=>c+": "+cards[c]).join("\n             ")}\n   Prevention: ${r.fix.trim()}\n\n`;});
  t+=`REFLECTION\n1. ${S.r1.trim()}\n\n2. ${S.r2.trim()}\n`;
  return t;
}
function vReport(){
  return `<div class="card"><h2>Your report</h2>
  <p>Completion code: <span class="code">${code(S.name)}</span></p>
  <div class="noprint"><p><b>To submit:</b> copy the report and paste it into the Canvas assignment, or use Print → Save as PDF and upload the file.</p>
  <p><button class="btn" onclick="copyRep(this)">Copy report</button> <button class="btn alt" onclick="try{window.print()}catch(e){}">Print / Save as PDF</button></p>
  <p class="note">If printing doesn't open, use Copy report instead.</p></div>
  <div id="report"><pre>${esc(reportText())}</pre></div></div>`;
}
function copyRep(b){navigator.clipboard.writeText(reportText()).then(()=>{b.textContent="Copied ✓";},()=>{b.textContent="Copy failed: select the text below";});}

/* ================= EVENT WIRING ================= */
function wire(){
  const m=document.getElementById("main");
  const nm=document.getElementById("nm");if(nm)nm.addEventListener("input",()=>{S.name=nm.value;save();refresh();});
  m.querySelectorAll("[data-h]").forEach(el=>{
    const ev=el.tagName==="SELECT"?"change":"input";
    el.addEventListener(ev,()=>{const h=hypById(el.dataset.h);if(h){h[el.dataset.f]=el.value;save();refresh();}});
  });
  m.querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click",()=>{S.hyp=S.hyp.filter(h=>h.id!==el.dataset.del);save();render();}));
  m.querySelectorAll("[data-lab]").forEach(el=>el.addEventListener("input",()=>{S.lab[el.dataset.lab]=el.value;save();}));
  m.querySelectorAll("[data-why]").forEach(el=>el.addEventListener("input",()=>{S.why[+el.dataset.why]=el.value;save();refresh();}));
  m.querySelectorAll("[data-t]").forEach(el=>{
    const ev=el.tagName==="SELECT"?"change":"input";
    el.addEventListener(ev,()=>{S.top[+el.dataset.t][el.dataset.f]=el.value;save();refresh();});
  });
  m.querySelectorAll(".rc .chip").forEach(el=>el.addEventListener("click",()=>{
    const i=[...m.querySelectorAll(".rc")].indexOf(el.closest(".rc"));const a=S.top[i].cards;const id=el.dataset.id;
    const j=a.indexOf(id);if(j>=0)a.splice(j,1);else a.push(id);el.classList.toggle("sel");save();refresh();}));
  m.querySelectorAll("[data-r]").forEach(el=>el.addEventListener("input",()=>{S[el.dataset.r]=el.value;save();document.getElementById(el.dataset.r+"c").textContent=words(el.value)+" words";refresh();}));
}

/* ================= INSTRUCTOR CHECKER (#checker) ================= */
function vChecker(){
  return `<div class="card"><h2>Instructor checker</h2><p>Enter a student's name exactly as it appears in Canvas to see their expected completion code and lab answers.</p>
  <input id="cn" type="text" oninput="chk(this.value)"><div id="co" style="margin-top:12px"></div></div>`;
}
function chk(n){
  const o=document.getElementById("co");if(!n.trim()){o.innerHTML="";return;}const p=params(n);
  o.innerHTML=`<p>Expected code: <span class="code">${code(n)}</span></p>
  <p><b>Part A</b> (R=${p.R} ft, h=${p.h} ft): a/g threshold=${fmt(p.srt)}, rollover speed=${fmt(p.vmph)} mph, a/g at ${VREF} mph=${fmt(p.a49)}</p>
  <p><b>Part B</b> (L=${p.L} ft, w=${p.w} kip/ft, S=${p.S} in³, T=${p.T}°C): M=${fmt(p.M,4)} kip·ft, σ=${fmt(p.sig,4)} ksi, FS₂₀=${fmt(p.FS20)}, FS<sub>T</sub>=${fmt(p.FST)}, deflection ×${fmt(p.sag)}</p>`;
}

function route(){
  if(location.hash==="#checker"){document.getElementById("nav").innerHTML="";document.getElementById("main").innerHTML=vChecker();}
  else{if(!STAGES.some(s=>s[0]===S.stage)||!unlocked(S.stage))S.stage="video";render();}
}
window.addEventListener("hashchange",route);
route();
</script>
