<script>
/* ================= AI SETTINGS =================

   Leave it empty to run the game without AI (the AI steps are then skipped). */
const AI_URL="https://i95-ai.nkellam.workers.dev";
/* Paste the link to your Canvas "Game help" discussion here (optional). */
const HELP_URL="";

/* ================= DATA ================= */
const STAGES=[["video","1. Watch & guess"],["interviews","2. Interviews"],["update","3. Update your list"],["lab","4. Lab bench"],["rca","5. Root cause analysis"],["reflect","6. Reflection"],["report","7. Report"]];
const VIDEO_ID="iKNw1mnA5M0";
const CATS=["People","Vehicle & equipment","Rules & organizations","Structure & materials","Environment & site"];
const STATUS=["Supported","Revised","Ruled out","Not enough evidence"];
const TYPES=["Direct cause","Contributing factor","Systemic root cause"];
const VIRTUES=["Attentiveness","Prudence (practical wisdom)","Responsibility","Integrity","Diligence","Humility","Courage","Foresight","Care for others","Honesty","Justice (fairness to those who bear the risk)"];
const JUDGE=["Virtue shown","Virtue missing","Mixed"];

/* k: tech | human | choice. Choice cards are "moments of choice": a decision someone made under real pressures. */
const CARDS={
 T1:{k:"tech",t:"Tire marks on the ramp showed the truck rolled over because of the speed it carried into the curve."},
 T2:{k:"tech",t:"Phone records showed no call or text at the time of the crash, ruling out phone distraction. The NTSB's probable cause: the driver failed to slow down, likely from inattention possibly linked to fatigue."},
 T3:{k:"tech",t:"When the trailer rolled, gasoline escaped through the open manhole and spread fire across the ramp and the underpass."},
 T4:{k:"tech",t:"Burning gasoline flowed into the storm drains. Explosions over several hours blew drain covers off along the path to the Delaware River, about 800 ft away."},
 T5:{k:"tech",t:"The truck came to rest and burned directly beneath the northbound I-95 overpass."},
 T6:{k:"tech",t:"The overpass was a concrete deck on steel girders. A fire on top is shielded by the concrete; a fire underneath heats the steel directly."},
 T7:{k:"tech",t:"Drivers' videos showed the deck sagging badly during the fire, minutes before it collapsed."},
 H1:{k:"human",t:"The driver was killed. About 160,000 vehicles a day lost their route until temporary lanes opened 12 days later."},
 H2:{k:"human",t:"The carrier had passed eight federal compliance reviews, none rated unsatisfactory, and the driver had signed its speed and manhole-cover policies. On paper, oversight looked fine."},
 M1:{k:"choice",who:"The driver",t:"Entered the curved ramp at about 44–54 mph. The advisory speed was 25 mph, and a truck rollover warning sign stood before the curve."},
 M2:{k:"choice",who:"The driver",t:"Drove with the tank's front manhole cover open through all three stops that shift. The pre-trip inspection was supposed to catch it, and federal rules require it closed in transport."},
 M3:{k:"choice",who:"The driver and the trucking industry",t:"Overnight shifts (10 p.m.–8 a.m.), switching to a daytime schedule on days off; about 5.5 hours of sleep opportunity the day before. The NTSB urges the industry to adopt fatigue-management programs."},
 M4:{k:"choice",who:"The trucking company",t:"A 2022 policy, written after an earlier leak from an unsecured cover, still relied on the driver's signature to confirm manhole covers. After the crash, the company switched to an electronic checklist that requires confirming each cover."},
 M5:{k:"choice",who:"Federal regulators",t:"The NTSB recommended stability control for large trucks in 2011. The rule only covers tractors built after August 2019, so this 2017 truck had none, though simulations showed it would have prevented the rollover. The NTSB still rates the response unacceptable."},
 M6:{k:"choice",who:"Bridge designers and code writers",t:"Like most highway bridges, this one wasn't designed for an extreme fire underneath. Fire protection costs money and such fires are rare; afterward, experts asked whether fire codes should change."},
 M7:{k:"choice",who:"Firefighters",t:"Shut down their water lines for a time because they couldn't confirm whether the burning storm sewers led toward a water treatment plant."},
 M8:{k:"choice",who:"Bridge inspectors",t:"Judged the southbound span unsafe even though it was still standing and closing it made the traffic crisis worse. It was demolished."}
};

const PEOPLE=[
 {id:"ntsb",name:"Morgan Hale",role:"Highway crash investigator",qs:[
   ["How fast was the truck going?","Our best estimate is somewhere between 44 and 54 mph as it entered the ramp. The advisory speed was 25, and there was a truck rollover warning sign before the curve. He'd driven routes like this before.","M1"],
   ["How do you know speed caused the rollover?","The tire marks. A truck that's going too fast for a curve leaves a signature on the pavement, and this one did.","T1"],
   ["Why didn't the driver slow down?","We checked his phone: no calls or texts at the time, so it wasn't the phone. Our probable cause is that he didn't slow down because he wasn't paying attention to the road, and that may have been related to fatigue.","T2"],
   ["Could the truck itself have prevented this?","Possibly. Newer tractors have electronic stability control, which brakes automatically when a truck starts to tip. We recommended it for big trucks back in 2011. The federal rule only covers tractors built after August 2019, and this one was a 2017. Our simulations say it would have prevented this rollover at any speed in that range. We still rate the government's response as unacceptable.","M5"]]},
 {id:"safety",name:"Chris Delgado",role:"Trucking company safety manager",qs:[
   ["What was the driver's schedule like?","He drove overnight, 10 p.m. to 8 a.m., and switched back to days on his days off, like a lot of drivers do to see their families. That's hard on anyone's body. The day before the crash he had only about five and a half hours to sleep. The NTSB keeps telling our industry to adopt real fatigue-management programs.","M3"],
   ["Was anything wrong with the tank?","Yes. The manhole cover on the front compartment was open. Video shows it open at every stop he made that shift. Federal rules say it has to be closed and secured whenever you're on the road.","M2"],
   ["Didn't anyone check?","Our policy said drivers check every cover before a trip, and he'd signed it. We'd written that policy after an earlier leak from an unsecured cover. But it still came down to one tired person remembering. After the crash, we switched to an electronic checklist that won't let you finish until you confirm each cover.","M4"],
   ["Didn't regulators check on your company?","They did. We'd been through eight federal compliance reviews, and none came back unsatisfactory. The driver had signed our speed and manhole-cover policies. On paper, everything looked fine.","H2"]]},
 {id:"fire",name:"Captain Rosa Ibáñez",role:"Fire department captain",qs:[
   ["Why was the fire so intense?","Gasoline came pouring out of that open manhole when the trailer went over, and it spread across the whole ramp and underpass. A closed tank would have been a very different fire.","T3"],
   ["What was strange about this fire?","The storm drains. Burning gasoline ran into them, and for hours we had explosions underground, popping drain covers off all the way toward the river, about 800 feet away.","T4"],
   ["Why did you stop spraying water at one point?","We couldn't confirm whether those burning sewers led toward a water treatment plant. Pushing more water in could have carried fuel somewhere much worse. So we shut our lines down until we knew more. That's a hard call when a highway is burning in front of you.","M7"],
   ["Where exactly was the fire?","Right under the northbound overpass. The truck came to rest and burned directly beneath the bridge.","T5"]]},
 {id:"eng",name:"Dr. Priya Nair",role:"Structural engineer",qs:[
   ["Why did a truck fire bring down a highway?","It's about where the fire was. This overpass was a concrete deck on steel girders. If a truck burns on top, the concrete shields the steel. This one burned underneath, so the girders took the heat directly.","T6"],
   ["Did the steel melt?","It didn't need to. Steel loses a lot of strength long before it melts. Look at the drivers' videos: the deck is sagging badly minutes before it falls. You'll put numbers on that at the lab bench.","T7"],
   ["Shouldn't bridges be designed for fire?","Most highway bridges aren't designed for an extreme fire underneath them. Fire protection costs money, and these fires are rare. Afterward, some experts asked whether codes should change. That's a tradeoff between cost and risk, and between the people who pay and the people who bear the risk.","M6"],
   ["What happened to the southbound side?","It was still standing, and closing it made a terrible traffic situation worse. But after inspection, the engineers judged it unsafe and took it down. Standing isn't the same as safe.","M8"]]}
];

/* Eurocode-style effective yield strength reduction for carbon steel */
const KY={20:1.00,400:1.00,500:0.78,600:0.47,700:0.23,800:0.11};
function interp(tab,T){const ks=Object.keys(tab).map(Number).sort((a,b)=>a-b);for(let i=0;i<ks.length-1;i++){if(T>=ks[i]&&T<=ks[i+1]){const f=(T-ks[i])/(ks[i+1]-ks[i]);return tab[ks[i]]+f*(tab[ks[i+1]]-tab[ks[i]]);}}return tab[800];}

/* ================= SEEDED PARAMETERS ================= */
function norm(n){return (n||"").trim().toLowerCase().replace(/\s+/g," ");}
function fnv(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0;}return h>>>0;}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function params(name){
  const r=rng(fnv("i95d|"+norm(name)));
  const L=60+2*Math.floor(r()*11);                           // ft
  const w=Math.round((2.0+0.1*Math.floor(r()*11))*10)/10;    // kip/ft
  const d=[24,27,30,33,36][Math.floor(r()*5)];               // in
  const c=d/2;
  const M=w*L*L/8;                                           // kip-ft
  const I=Math.round(M*12*c/(24+r()*6)/100)*100;             // in^4
  const T=[600,650,700][Math.floor(r()*3)];
  const sx=12+Math.floor(r()*9);                             // ksi
  const sy=-(2+Math.floor(r()*5));                           // ksi
  const tau=(r()<0.5?-1:1)*(4+Math.floor(r()*6));            // ksi
  const RA=w*L/2, sig=M*12*c/I, FS20=50/sig, ky=interp(KY,T), FST=50*ky/sig, Fyh=50*ky;
  const avg=(sx+sy)/2, Rm=Math.hypot((sx-sy)/2,tau), s1=avg+Rm, s2=avg-Rm;
  const th=0.5*Math.atan2(tau,(sx-sy)/2)*180/Math.PI;        // + = CCW (Hibbeler)
  return {L,w,d,c,I,T,M,RA,sig,FS20,ky,FST,Fyh,sx,sy,tau,avg,Rm,s1,s2,th,thMag:Math.abs(th),thDir:th>0?"Counterclockwise":"Clockwise",yields:s1>Fyh?"Yes":"No"};
}
function code(name){
  const p=params(name);const h=fnv("I95d1|"+norm(name)+"|"+p.L+p.w+p.I+p.T+p.sx+p.sy+p.tau);
  const h2=fnv(String(h)+"|kellam");
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="",x=h,y=h2;
  for(let i=0;i<4;i++){s+=A[x%32];x=Math.floor(x/32);}s+="-";
  for(let i=0;i<4;i++){s+=A[y%32];y=Math.floor(y/32);}return s;
}

/* ================= STATE ================= */
const KEY="egr343-i95-collapse-v2", OLDKEY="egr343-i95-collapse-v1";
const blankTop=()=>({h:"",cards:[],type:"",fix:""});
const blankMC=()=>({m:"",judge:"",virtue:"",hard:"",wise:""});
let S={stage:"video",name:"",hyp:[],nextId:1,locked:false,asked:{},person:"ntsb",cards:[],lab:{},tries:{},labDone:{a:false,b:false},unitSlips:0,
  why:["","","","",""],mc:[blankMC(),blankMC(),blankMC()],top:[blankTop(),blankTop(),blankTop()],r1:"",r2:"",r3:"",
  chat:{ntsb:[],safety:[],fire:[],eng:[]},coach:{whys:[],moments:[]},aiFail:false,test:{}};
try{
  const s=localStorage.getItem(KEY);
  if(s)S=Object.assign(S,JSON.parse(s));
  else{const o=localStorage.getItem(OLDKEY);if(o){const old=JSON.parse(o);["name","hyp","nextId","locked","asked","why","r1","r2"].forEach(k=>{if(old[k]!==undefined)S[k]=old[k];});if(S.locked)S.stage="interviews";}}
}catch(e){}
if(!S.hyp.length){addHyp("video");addHyp("video");addHyp("video");addHyp("video");}
S.cards=[];if(Object.keys(S.asked).length||S.locked)give("H1");
PEOPLE.forEach(p=>p.qs.forEach((q,i)=>{if(S.asked[p.id+i])give(q[2]);}));

function words(t){return (t||"").trim().split(/\s+/).filter(Boolean).length;}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(x,d=3){return Number(Number(x).toPrecision(d)).toLocaleString("en-US",{maximumFractionDigits:3});}
const vidHyps=()=>S.hyp.filter(h=>h.src==="video");
const intHyps=()=>S.hyp.filter(h=>h.src==="interview");
const okHyp=h=>words(h.t)>=3&&!!h.c;
const validCode=()=>/^[A-Za-z0-9_-]{4,20}$/.test((S.name||"").trim());
const codeMsg=()=>!S.name?"":validCode()?'<span class="ok">✓ Good code. Write it down.</span>':'<span class="bad">Use 4–20 letters, numbers, - or _, with no spaces.</span>';
const hypById=id=>S.hyp.find(h=>h.id===id);

/* ================= AI ================= */
let busy=null; // which chat is waiting for a reply
let aiDown=false; // resets each visit, so a temporary outage doesn't turn the AI off for good
const aiOn=()=>!!AI_URL&&!aiDown;
const testDone=pid=>!!(S.test&&S.test[pid]&&S.test[pid].done);
const coached=sec=>S.coach[sec].some(m=>m.role==="assistant");
async function callAI(payload){
  const r=await fetch(AI_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});
  if(!r.ok)throw new Error("AI "+r.status);
  const d=await r.json();if(!d.reply)throw new Error("empty");return d.reply;
}
function aiError(){
  aiDown=true;
  return "The AI isn't responding right now, so this step is optional for you. Keep going with the rest of the investigation.";
}
const canSpeak=()=>"speechSynthesis" in window;
function speak(t){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t));}catch(e){}}
const listenBtn=t=>canSpeak()?`<button type="button" class="listen" onclick="speak(this.dataset.t)" data-t="${esc(t)}"><span aria-hidden="true">🔊</span> Listen</button>`:"";
function bubbles(list){return list.map(m=>`<div class="bubble ${m.role}"><span class="lbl">${m.role==="user"?"You":esc(m.who||"")}${m.role==="assistant"?listenBtn(m.content):""}</span>${esc(m.show??m.content)}</div>`).join("");}
async function askOwn(pid){
  const inp=document.getElementById("own_"+pid);const q=(inp.value||"").trim();if(!q||busy)return;
  const who=PEOPLE.find(x=>x.id===pid).name;
  S.chat[pid].push({role:"user",content:q.slice(0,600)});busy=pid;save();render();
  try{const reply=await callAI({mode:"interview",character:pid,messages:S.chat[pid].map(({role,content})=>({role,content})).slice(-14)});

  switch(st){
    case"video":return validCode()&&vidHyps().filter(okHyp).length>=4&&vidHyps().every(h=>okHyp(h)||!h.t.trim());

    case"report":return false;
  }
}

function calcCards(){
  const p=P(),c={};
  if(S.labDone.a)c.C1={k:"calc",t:`Your lab: the girder's factor of safety against yield drops from ${fmt(p.FS20)} at room temperature to ${fmt(p.FST)} at ${p.T}°C.`};
  if(S.labDone.b)c.C2={k:"calc",t:`Your lab: in the girder web near the support, σ₁ = ${fmt(p.s1)} ksi. At ${p.T}°C the steel's yield strength is only ${fmt(p.Fyh)} ksi, so by this simple check the web ${p.yields==="Yes"?"yields":"does not yet yield"}.`};
  return c;
}
function allCards(){return Object.assign({},Object.fromEntries(S.cards.map(k=>[k,CARDS[k]])),calcCards());}
const liveHyps=()=>S.hyp.filter(h=>okHyp(h)&&h.s!=="Ruled out");
const choiceIds=()=>S.cards.filter(k=>CARDS[k].k==="choice");
function rcaErrors(){
  const e=[];
  S.why.forEach((w,i)=>{if(words(w)<4)e.push(`5 Whys: answer why #${i+1} (at least 4 words).`);});
  S.mc.forEach((r,i)=>{const n=i+1;
    if(!r.m)e.push(`Moment of choice ${n}: choose a moment.`);
    if(!r.judge)e.push(`Moment of choice ${n}: judge it.`);
    if(!r.virtue)e.push(`Moment of choice ${n}: name the virtue.`);
    if(words(r.hard)<12)e.push(`Moment of choice ${n}: explain what made the right action hard (12+ words, ${words(r.hard)} so far).`);
    if(words(r.wise)<12)e.push(`Moment of choice ${n}: describe practical wisdom or a system change (12+ words, ${words(r.wise)} so far).`);});
  const ms=S.mc.map(r=>r.m).filter(Boolean);
  if(new Set(ms).size<ms.length)e.push("Choose three different moments of choice.");
  if(!S.mc.some(r=>r.judge==="Virtue shown"))e.push("At least one moment should be one where a virtue was shown. Investigations learn from what went right, too.");
  if(!S.mc.some(r=>r.judge==="Virtue missing"))e.push("At least one moment should be one where a virtue was missing.");
  S.top.forEach((r,i)=>{const n=i+1;
    if(!r.h||!hypById(r.h))e.push(`Root cause ${n}: choose one from your list.`);
    if(r.cards.length<2)e.push(`Root cause ${n}: link at least 2 evidence cards.`);
    if(!r.type)e.push(`Root cause ${n}: classify it.`);
    if(words(r.fix)<12)e.push(`Root cause ${n}: propose a prevention in at least 12 words (${words(r.fix)} so far).`);});
  const hs=S.top.map(r=>r.h).filter(Boolean);
  if(new Set(hs).size<hs.length)e.push("Your three root causes must be different.");
  if(aiOn()&&!coached("whys"))e.push("Ask the coach about your 5 Whys at least once.");
  if(aiOn()&&!coached("moments"))e.push("Ask the coach about your moments of choice at least once.");
  const cat=r=>{const h=hypById(r.h);return h?h.c:"";};
  if(!S.top.some(r=>r.cards.some(c=>c[0]==="C")))e.push("At least one root cause must be backed by your own lab result (C1 or C2).");
  if(!S.top.some(r=>cat(r)==="Structure & materials"))e.push("At least one root cause must be in Structure & materials.");
  if(!S.top.some(r=>cat(r)==="People"||cat(r)==="Rules & organizations"))e.push("At least one root cause must be in People or Rules & organizations. Collapses are never only technical.");
  return e;
}

function drawMohr(){
  const el=document.getElementById("mohr");if(!el)return;const p=P();
  const W=560,H=360,pad=40;
  const hr=Math.max((p.sx-p.sy)/2,Math.abs(p.tau))*1.45+1;
  const mid=(p.sx+p.sy)/2;
  let xmin=Math.min(0,mid-hr),xmax=Math.max(0,mid+hr);
  const k=Math.min((W-2*pad)/(xmax-xmin),(H-2*pad)/(2*hr));
  const X=v=>pad+(v-xmin)*k, Y=t=>H/2+t*k;      // tau positive DOWN
  let s=`<svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mohr's circle plot with sigma on the horizontal axis and tau plotted positive downward. The x-face point is at (${p.sx}, ${p.tau}) and the y-face point is at (${p.sy}, ${-p.tau}).${isFinite(parseFloat(S.lab.mC))&&isFinite(parseFloat(S.lab.mR))?` Your circle has center ${S.lab.mC} and radius ${S.lab.mR}.`:""}" style="color:#555">${DEFS}`;
  s+=`<line x1="${pad-10}" y1="${H/2}" x2="${W-10}" y2="${H/2}" stroke="#555" stroke-width="1.3" marker-end="url(#ah)"/><text x="${W-14}" y="${H/2-8}" font-size="15" text-anchor="end" font-style="italic">σ (ksi)</text>`;
  s+=`<line x1="${X(0)}" y1="14" x2="${X(0)}" y2="${H-8}" stroke="#555" stroke-width="1.3" marker-end="url(#ah)"/><text x="${X(0)+8}" y="${H-12}" font-size="15" font-style="italic">τ (+ down)</text>`;
  // student circle
  const C=parseFloat(S.lab.mC),R=parseFloat(S.lab.mR);let msg="";
  const px=[p.sx,p.tau],py=[p.sy,-p.tau];
  s+=`<line x1="${X(px[0])}" y1="${Y(px[1])}" x2="${X(py[0])}" y2="${Y(py[1])}" stroke="#999" stroke-dasharray="5 4"/>`;
  if(isFinite(C)&&isFinite(R)&&R>0){
    s+=`<circle cx="${X(C)}" cy="${Y(0)}" r="${R*k}" fill="none" stroke="#1565c0" stroke-width="2"/><circle cx="${X(C)}" cy="${Y(0)}" r="3.5" fill="#1565c0"/>`;
    const e1=Math.abs(Math.hypot(px[0]-C,px[1])-R),e2=Math.abs(Math.hypot(py[0]-C,py[1])-R);
    msg=(e1<0.03*R&&e2<0.03*R)?'<span class="ok">✓ Your circle passes through both the x-face and y-face points.</span>':'<span class="bad">Your circle (blue) misses at least one face point. A correct circle passes through both.</span>';
  }else msg='<span class="note">Enter your center and radius to draw your circle.</span>';
  s+=`<circle cx="${X(px[0])}" cy="${Y(px[1])}" r="5" fill="#b00020"/><text x="${X(px[0])+8}" y="${Y(px[1])+(px[1]<0?-8:16)}" font-size="13" fill="#b00020">x-face (${p.sx}, ${p.tau})</text>`;
  s+=`<circle cx="${X(py[0])}" cy="${Y(py[1])}" r="5" fill="#1565c0"/><text x="${X(py[0])+8}" y="${Y(py[1])+(py[1]<0?-8:16)}" font-size="13" fill="#1565c0">y-face (${p.sy}, ${-p.tau})</text>`;
  if(S.labDone.b){s+=`<circle cx="${X(p.s1)}" cy="${Y(0)}" r="5" fill="#2e7d32"/><text x="${X(p.s1)}" y="${Y(0)-10}" font-size="13" fill="#2e7d32" text-anchor="middle">σ₁</text><circle cx="${X(p.s2)}" cy="${Y(0)}" r="5" fill="#2e7d32"/><text x="${X(p.s2)}" y="${Y(0)-10}" font-size="13" fill="#2e7d32" text-anchor="middle">σ₂</text>`;}
  s+=`</svg>`;
  el.innerHTML=s;document.getElementById("mohrmsg").innerHTML=msg;
}

function near(v,t,tol=0.02){v=parseFloat(v);if(!isFinite(v))return false;return Math.abs(v-t)<=tol*Math.abs(t)+1e-9;}
function checkLab(part){

  const mark=(k,ok)=>{L[k+"_ok"]=ok;if(!ok)all=false;};
  if(part==="a"){

      else if(near(L.pM,p.M*12))fb.push("Moment: this question asks for kip·ft. Convert to kip·in in the next step.");}
    mark("pS",near(L.pS,p.sig));

      else if(near(L.pS,p.sig*2))fb.push("Stress: c is measured from the neutral axis to the outer fiber, which is half the depth.");
      else if(near(L.pS,p.sig*1000)){fb.push("Units: that looks like psi. Answer in ksi.");S.unitSlips=(S.unitSlips||0)+1;}}
    mark("pF1",near(L.pF1,p.FS20));
    mark("pK",near(L.pK,p.ky));if(!L.pK_ok&&p.T===650&&(near(L.pK,0.47)||near(L.pK,0.23)))fb.push("k<sub>y</sub>: 650°C falls between two table entries, so interpolate.");

    mark("mR",near(L.mR,p.Rm));
    if(!L.mR_ok){if(near(L.mR,Math.hypot(p.sx-p.sy,p.tau)))fb.push("Radius: use half the difference, R = √[((σ<sub>x</sub> − σ<sub>y</sub>)/2)² + τ<sub>xy</sub>²].");
      else if(near(L.mR,Math.hypot(p.avg,p.tau)))fb.push("Radius: inside the square root it's (σ<sub>x</sub> − σ<sub>y</sub>)/2, not the average.");
      else fb.push("Radius: R is the distance from the center to the x-face point. Your circle on the plot should pass through both face points.");}
    mark("m1",near(L.m1,p.s1));mark("m2",near(L.m2,p.s2));
    if(near(L.m1,p.s2)&&near(L.m2,p.s1))fb.push("Principal stresses: σ<sub>1</sub> is the larger (algebraically) of the two.");
    mark("mT",near(L.mT,p.thMag));
    if(!L.mT_ok){if(near(L.mT,2*p.thMag))fb.push("Angle: that's 2θ<sub>p</sub>, the angle on the circle. The element rotates half as much.");
      else if(near(L.mT,90-p.thMag))fb.push("Angle: measure from the x-face point to σ<sub>1</sub> on the circle (2θ<sub>p1</sub>), then halve it.");}
    mark("mD",L.mD===p.thDir);if(!L.mD_ok&&L.mD)fb.push("Direction: on Hibbeler's circle (τ positive downward), the element rotates in the same direction you rotate on the circle from the x-face point to σ<sub>1</sub>.");
    mark("mX",near(L.mX,p.Rm));if(!L.mX_ok&&near(L.mX,p.s1))fb.push("τ<sub>max</sub>: the maximum in-plane shear stress equals the radius of the circle.");
    mark("mY",near(L.mY,p.Fyh));if(!L.mY_ok&&near(L.mY,50))fb.push("Hot yield strength: multiply F<sub>y</sub> by k<sub>y</sub> at your temperature (same as Problem 1).");
    mark("mQ",L.mQ===p.yields);
  }
  L[part+"fb"]=fb;if(all){S.labDone[part]=true;}
  save();render();
}

async function toJpeg(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");
    c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);const g=c.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);return c.toDataURL("image/jpeg",0.8);}
  finally{URL.revokeObjectURL(url);}
}

  return out;
}
const b64bytes=dataURL=>{const b=atob(dataURL.split(",")[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function makePDF(){
  await loadPdfLib();const {PDFDocument,StandardFonts}=window.PDFLib;
  const doc=await PDFDocument.create();const font=await doc.embedFont(StandardFonts.Helvetica);const bold=await doc.embedFont(StandardFonts.HelveticaBold);
  const W=612,H=792,M=54,size=10,lh=13.5;let page=doc.addPage([W,H]);let y=H-M;
  const newPage=()=>{page=doc.addPage([W,H]);y=H-M;};
  const line=(txt,f,sz)=>{if(y<M){newPage();}page.drawText(txt,{x:M,y,size:sz,font:f});y-=lh*sz/size;};
  const para=(txt)=>{
    for(const raw of pdfSafe(txt).split("\n")){
      if(!raw.trim()){y-=lh*0.6;continue;}
      const head=/^[A-Z0-9][A-Z0-9 ():,&.'\/-]+$/.test(raw.trim())&&raw.trim().length>3;const f=head?bold:font,sz=head?11:size;
      if(head)y-=4;
      const ind=raw.match(/^\s*/)[0];let cur=ind;
      for(const w of raw.trim().split(/\s+/)){const test=cur.trim()?cur+" "+w:ind+w;
        if(f.widthOfTextAtSize(test,sz)>W-2*M&&cur.trim()){line(cur,f,sz);cur=ind+"   "+w;}else cur=test;}
      line(cur,f,sz);
    }
  };
  para(reportText());
  for(const part of ["a","b"]){
    const mine=FILES.filter(f=>f.prob===part);
    for(let i=0;i<mine.length;i++){const f=mine[i];const title=pdfSafe(`Handwritten work: ${PROB[part]} (page ${i+1} of ${mine.length}): ${f.name}`);
      newPage();page.drawText(title,{x:M,y:H-M,size:11,font:bold});
      try{
        if(f.type==="jpg"){const img=await doc.embedJpg(b64bytes(f.data));const k=Math.min((W-2*M)/img.width,(H-2*M-24)/img.height);
          page.drawImage(img,{x:M,y:H-M-24-img.height*k,width:img.width*k,height:img.height*k});}
        else{page.drawText("(Attached PDF follows.)",{x:M,y:H-M-18,size:10,font});
          const src=await PDFDocument.load(b64bytes(f.data),{ignoreEncryption:true});const pages=await doc.copyPages(src,src.getPageIndices());pages.forEach(pg=>doc.addPage(pg));}
      }catch(e){page.drawText("(This file could not be attached. Upload it to Canvas separately.)",{x:M,y:H-M-18,size:10,font});}
    }
  }
  return await doc.save();
}
async function downloadPDF(btn){
  const msg=document.getElementById("pdfmsg");const old=btn.textContent;btn.disabled=true;btn.textContent="Building your PDF…";
  try{const bytes=await makePDF();dl(`I95-investigation-${S.name}.pdf`,new Blob([bytes],{type:"application/pdf"}));msg.innerHTML='<span class="ok">✓ PDF downloaded. Check your Downloads folder, then upload it to Canvas.</span>';}
  catch(e){msg.innerHTML='<span class="bad">Couldn\'t build the PDF here. Make sure you opened the game from its GitHub link. If it still fails, click Copy report text, paste it into Canvas, and upload your photos there too.</span>';}
  btn.disabled=false;btn.textContent=old;
}

/* ================= EVENT WIRING ================= */
function wire(){
  const m=document.getElementById("main");
  const nm=document.getElementById("nm");if(nm)nm.addEventListener("input",()=>{S.name=nm.value.trim();save();const cm=document.getElementById("codeMsg");if(cm)cm.innerHTML=codeMsg();refresh();});
  const on=(sel,fn)=>m.querySelectorAll(sel).forEach(el=>el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>fn(el)));
  m.querySelectorAll("[data-up]").forEach(el=>el.addEventListener("change",()=>{if(el.files&&el.files.length)handleUpload(el.dataset.up,el.files);}));
  m.querySelectorAll("[data-rm]").forEach(el=>el.addEventListener("click",()=>{FILES=FILES.filter(f=>f.id!==el.dataset.rm);saveFiles();render();}));
  on("[data-h]",el=>{const h=hypById(el.dataset.h);if(h){h[el.dataset.f]=el.value;save();refresh();}});
  m.querySelectorAll("[data-del]").forEach(el=>el.addEventListener("click",()=>{S.hyp=S.hyp.filter(h=>h.id!==el.dataset.del);save();render();}));
  on("[data-lab]",el=>{S.lab[el.dataset.lab]=el.value;save();if(el.dataset.lab==="mC"||el.dataset.lab==="mR")drawMohr();});
  on("[data-why]",el=>{S.why[+el.dataset.why]=el.value;save();refresh();});
  on("[data-mc]",el=>{S.mc[+el.dataset.mc][el.dataset.f]=el.value;save();refresh();});
  on("[data-t]",el=>{S.top[+el.dataset.t][el.dataset.f]=el.value;save();refresh();});
  m.querySelectorAll(".rc .chip").forEach(el=>el.addEventListener("click",()=>{
    const rcs=[...m.querySelectorAll(".rc:not(.mc)")];const i=rcs.indexOf(el.closest(".rc"));const a=S.top[i].cards;const id=el.dataset.id;
    const j=a.indexOf(id);if(j>=0)a.splice(j,1);else a.push(id);el.classList.toggle("sel");el.setAttribute("aria-pressed",el.classList.contains("sel"));save();refresh();}));
  on("[data-r]",el=>{S[el.dataset.r]=el.value;save();document.getElementById(el.dataset.r+"c").textContent=words(el.value)+" words";refresh();});
}

/* ================= INSTRUCTOR CHECKER (#checker) ================= */
function vChecker(){
  return `<div class="card"><h2>Instructor checker</h2><p>Enter a student's investigator code (from their report) to see their expected completion code and lab answers. Codes aren't case-sensitive.</p>
  <input id="cn" type="text" oninput="chk(this.value)"><div id="co" style="margin-top:12px"></div></div>`;
}
function chk(n){
  const o=document.getElementById("co");if(!n.trim()){o.innerHTML="";return;}const p=params(n);
  o.innerHTML=`<p>Expected code: <span class="code">${code(n)}</span></p>
  <p><b>Problem 1</b> (L=${p.L} ft, w=${p.w} kip/ft, I=${p.I} in⁴, c=${p.c} in, T=${p.T}°C): A<sub>y</sub>=${fmt(p.RA,4)} kip, M=${fmt(p.M,4)} kip·ft, σ=${fmt(p.sig,4)} ksi, FS₂₀=${fmt(p.FS20)}, k<sub>y</sub>=${fmt(p.ky)}, FS<sub>T</sub>=${fmt(p.FST)}</p>
  <p><b>Problem 2</b> (σx=${p.sx}, σy=${p.sy}, τxy=${p.tau} ksi): center=${fmt(p.avg)}, R=${fmt(p.Rm,4)}, σ₁=${fmt(p.s1,4)}, σ₂=${fmt(p.s2,4)}, θp1=${fmt(p.thMag)}° ${p.thDir}, τmax=${fmt(p.Rm,4)}, k<sub>y</sub>F<sub>y</sub>=${fmt(p.Fyh)} ksi, yields? ${p.yields}</p>`;
}

function route(){
  if(location.hash==="#checker"){document.getElementById("nav").innerHTML="";document.getElementById("main").innerHTML=vChecker();}
  else{if(!STAGES.some(s=>s[0]===S.stage)||!unlocked(S.stage))S.stage=S.locked?"interviews":"video";if(!unlocked(S.stage))S.stage="video";render();}
}
window.addEventListener("hashchange",route);
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
loadFiles().then(route);
